name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_lane:
        description: "Run optional agent-device web lane (downloads managed browser backend)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lab tests (doctor / devices / client / evidence)
        run: bun test --max-concurrency=1

      - name: Skills layout + frontmatter
        run: bun run check:skills

      - name: Bun audit
        run: bun audit

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: evidence
          path: out/evidence/
          if-no-files-found: ignore

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.17.0"
          run_install: false

      - name: Setup Node 24.13
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.13"

      - name: Upstream CI cohort at pin
        run: bash scripts/upstream-ci.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml .

      - name: Fetch upstream for osv-scanner
        run: bash scripts/fetch-upstream.sh

      - name: Install pinned osv-scanner
        run: |
          OSV_VERSION=2.7.0
          OSV_SHA256=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: osv-scanner on upstream pnpm-lock.yaml
        run: ./osv-scanner scan --config osv-scanner.toml --lockfile vendor/agent-device/pnpm-lock.yaml

      - name: Skills frontmatter
        run: bun run check:skills

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills

  web-lane:
    if: github.event_name == 'workflow_dispatch' && inputs.web_lane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Optional web lane
        run: |
          set -euo pipefail
          node node_modules/agent-device/bin/agent-device.mjs web setup
          node node_modules/agent-device/bin/agent-device.mjs web doctor
          node node_modules/agent-device/bin/agent-device.mjs open https://example.com --platform web
          node node_modules/agent-device/bin/agent-device.mjs snapshot -i --platform web
          mkdir -p out/evidence
          node node_modules/agent-device/bin/agent-device.mjs screenshot out/evidence/web.png --platform web
          node node_modules/agent-device/bin/agent-device.mjs close
